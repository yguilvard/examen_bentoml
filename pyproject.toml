[project]
name = "examen-bentoml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "bentoml>=1.4.36",
    "fastapi>=0.116.1",
    "pandas>=2.2.3",
    "pyjwt>=2.10.1",
    "scikit-learn>=1.7.1",
    "requests>=2.32.5",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "examen-bentoml",
    "pytest>=8.4.2",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
examen-bentoml = { workspace = true, editable = true }

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "predictions.py"]
